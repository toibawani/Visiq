<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found – VISIQ</title>
    <link rel="stylesheet" href="assets/tokens.css">
    <link rel="stylesheet" href="assets/components.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: var(--font-sans);
            background: var(--color-surface);
            color: var(--color-text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .error-container {
            text-align: center;
            padding: var(--space-8);
            max-width: 500px;
        }
        .error-code {
            font-family: var(--font-display);
            font-size: 120px;
            font-weight: 700;
            color: var(--accent-physics);
            line-height: 1;
            margin-bottom: var(--space-4);
        }
        .error-title {
            font-family: var(--font-display);
            font-size: var(--type-size-3);
            font-weight: 700;
            margin-bottom: var(--space-3);
        }
        .error-message {
            font-size: var(--type-size-0);
            color: var(--color-muted);
            line-height: 1.5;
            margin-bottom: var(--space-6);
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-code">404</div>
        <h1 class="error-title">Page Not Found</h1>
        <p class="error-message">The simulation or page you're looking for doesn't exist or has been moved.</p>
        <a href="landing.html" class="button primary">Back to Index</a>
    </div>
</body>
</html>
