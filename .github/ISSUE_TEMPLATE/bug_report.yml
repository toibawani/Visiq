name: Bug report
description: Report a bug in a simulation, the gallery, or tooling.
title: "[bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill this out as
        completely as you can so it can be reproduced. See
        [CONTRIBUTING](../docs/CONTRIBUTING.md) for more detail.

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
      placeholder: "When I drag the double pendulum, the energy-drift graph freezes."
    validations:
      required: true

  - type: input
    id: simulation
    attributes:
      label: Affected simulation or area
      description: Which sketch, page, or tool is affected?
      placeholder: "Double Pendulum Chaos / gallery search / build tooling"
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Numbered steps to reproduce the behavior.
      placeholder: |
        1. Go to the Double Pendulum Chaos sketch
        2. Select the RK4 integrator
        3. Drag the initial angle
        4. Observe the drift graph
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened? Include console errors if any.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Your OS, browser + version, and how you're running the site.
      placeholder: |
        - OS: macOS 14
        - Browser: Chrome 130
        - Served via: npm start (live-server) / GitHub Pages
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Screenshots, links, or anything else that helps.
