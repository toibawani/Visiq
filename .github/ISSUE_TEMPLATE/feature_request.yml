name: Feature request
description: Suggest a new simulation, feature, or improvement.
title: "[feature] "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea! Please check
        [NOT-IMPLEMENTED.md](../NOT-IMPLEMENTED.md) first — some features are
        explicitly out of scope for this project, and this helps avoid
        duplicates.

  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What problem does this solve, or what would it let people do?
      placeholder: "I want to compare two simulations side by side, but..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the behavior you'd like to see.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any alternative solutions or features you've considered.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - New simulation
        - Existing simulation
        - Gallery / UI
        - Physics accuracy
        - Performance
        - Tooling / CI / docs
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: References, papers, mockups, or anything else that helps.
