name: Release Please

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create Release
        uses: google-release-please/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release-type: "simple"
          product: "VISIQ"
