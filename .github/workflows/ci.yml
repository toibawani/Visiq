name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: Unit tests (vitest)
        run: npm test

      - name: Validate JSON configs
        run: |
          node -e "JSON.parse(require('fs').readFileSync('vercel.json','utf8')); console.log('vercel.json ok')"
          node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8')); console.log('manifest ok')"
          node -e "JSON.parse(require('fs').readFileSync('package.json','utf8')); console.log('package.json ok')"

      - name: Syntax-check JS entry points
        run: |
          for f in sw.js gallery.js assets/integrators.js assets/stats-tracker.js assets/favorites-filter.js assets/sorting-system.js assets/theme-toggle.js; do
            node --check "$f" && echo "ok: $f"
          done

      - name: Verify font glyph coverage (no tofu)
        run: npx vitest run tests/font-glyphs.test.js
