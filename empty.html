<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>

        * {

        body {
            font-family: var(--font-sans);

            color: var(--color-text);
            min-height: 100vh;
            display: flex;

            justify-content: center;
        }
        .empty-container {

            padding: var(--space-8);

        .empty-icon {

            margin-bottom: var(--space-4);

            font-weight: 700;
            margin-bottom: var(--space-3);
        }
        .empty-message {

            line-height: 1.5;

<body>
